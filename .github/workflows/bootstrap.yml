name: Bootstrap The Journey

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/bootstrap.yml"
      - ".bootstrap/part-*"

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Rebuild the application scaffold
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap/part-* > /tmp/the-journey.b64
          base64 -d /tmp/the-journey.b64 > /tmp/the-journey.tar.gz
          echo "f9fc740630fae2926ab9d7121fe7b7739784b63c041bef97c7b67315d2fad93e  /tmp/the-journey.tar.gz" | sha256sum -c -
          tar -xzf /tmp/the-journey.tar.gz -C .

      - name: Vendor Iraq governorate boundaries
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public/data
          curl -L --retry 3 --fail             "https://raw.githubusercontent.com/tawfek/Iraqi-Cities-and-Districts-data/master/data/geoBoundaries-IRQ-ADM1_simplified.geojson"             -o public/data/iraq-governorates.geojson
          cat > public/data/IRAQ_BOUNDARIES_ATTRIBUTION.md <<'EOF'
          # Iraq governorate boundaries attribution

          Source: tawfek/Iraqi-Cities-and-Districts-data
          File: data/geoBoundaries-IRQ-ADM1_simplified.geojson
          License: Creative Commons Attribution 4.0 International (CC BY 4.0)
          Changes: vendored into this repository for the interactive Iraq governorate map.
          EOF

      - name: Remove one-time bootstrap material
        shell: bash
        run: |
          rm -rf .bootstrap
          rm -f .github/workflows/bootstrap.yml

      - name: Commit application foundation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "the-journey-bootstrap"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "feat: build The Journey foundation"
          git push
